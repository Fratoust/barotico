name: Preview V2 (Cloudflare, not public)
# Deploys the working version of branch preview-v2 to https://barotico-preview.barotico-app.workers.dev
# Unlisted and hidden from search engines (robots.txt Disallow + X-Robots-Tag noindex). Never touches barotico.com.
on:
  push:
    branches: [preview-v2]
  workflow_dispatch:
permissions:
  contents: read
concurrency: preview-deploy
jobs:
  preview:
    if: github.ref == 'refs/heads/preview-v2'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build the preview
        run: |
          mkdir -p ../dist
          rsync -a --exclude .git --exclude .github --exclude push --exclude tools --exclude archive --exclude node_modules --exclude CNAME ./ ../dist/
          printf 'User-agent: *\nDisallow: /\n' > ../dist/robots.txt
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n' > ../dist/_headers
          rm -f ../dist/sitemap.xml ../dist/91a26bb7de1f729139af21408c8bb57d.txt
          mv ../dist ./dist
          cat > wrangler-preview.toml <<'T'
          name = "barotico-preview"
          compatibility_date = "2026-11-01"
          workers_dev = true
          [assets]
          directory = "./dist"
          not_found_handling = "404-page"
          T
          sed -i 's/^          //' wrangler-preview.toml
          echo "files: $(find dist -type f | wc -l)"
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx -y wrangler@4 deploy --config wrangler-preview.toml
