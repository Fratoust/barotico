name: Manifesto Project sync
# Monthly: party manifesto categories from the Manifesto Project (needs the repository secret MANIFESTO_API_KEY).
on:
  schedule:
    - cron: "23 4 3 * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: manifesto-sync
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Sync
        env:
          MANIFESTO_API_KEY: ${{ secrets.MANIFESTO_API_KEY }}
        run: node tools/manifesto_sync.js
      - name: Save
        run: |
          git config user.name "barotico-bot"; git config user.email "contact@barotico.com"
          git add data/manifesto 2>/dev/null || true
          if ! git diff --cached --quiet; then git commit -m "data: Manifesto Project sync"; git pull --rebase --autostash origin main; git push origin HEAD:main; fi
