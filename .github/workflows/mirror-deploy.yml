name: Backup copy (Cloudflare mirror)
# Keeps a full copy of the site online at https://barotico-mirror.<subdomain>.workers.dev,
# hidden from search engines, ready if GitHub Pages ever becomes unavailable.
on:
  push:
    branches: [main]
    paths-ignore: ["archive/**", "push/**", ".github/workflows/archive-sources.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency: mirror-deploy
jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build the copy
        run: |
          mkdir -p ../dist
          rsync -a --exclude .git --exclude .github --exclude push --exclude tools --exclude archive --exclude node_modules --exclude CNAME ./ ../dist/
          printf 'User-agent: *\nDisallow: /\n' > ../dist/robots.txt
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n' > ../dist/_headers
          mv ../dist ./dist
          cat > wrangler-mirror.toml <<'T'
          name = "barotico-mirror"
          compatibility_date = "2026-11-01"
          workers_dev = true
          [assets]
          directory = "./dist"
          not_found_handling = "404-page"
          T
          sed -i 's/^          //' wrangler-mirror.toml
          echo "files: $(find dist -type f | wc -l)"
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx -y wrangler@4 deploy --config wrangler-mirror.toml
