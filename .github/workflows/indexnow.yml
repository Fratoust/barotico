name: IndexNow
# Tells Bing, Yandex, Seznam, Naver and Yep which pages changed after each push.
# Google does not use IndexNow: use Search Console for Google.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: "Submit every URL in sitemap.xml"
        type: boolean
        default: true
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Wait for GitHub Pages to publish
        if: github.event_name == 'push'
        run: sleep 240
      - name: Submit URLs
        env:
          KEY: 91a26bb7de1f729139af21408c8bb57d
          ALL: ${{ (github.event_name == 'workflow_dispatch' && inputs.all) || contains(github.event.head_commit.message, '[indexnow-all]') }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.request
          host = "barotico.com"
          key = os.environ["KEY"]
          if os.environ.get("ALL") == "true":
              urls = re.findall(r"<loc>([^<]+)</loc>", open("sitemap.xml", encoding="utf8").read())
          else:
              diff = subprocess.run(["git", "diff", "--name-only", "HEAD~1", "HEAD"], capture_output=True, text=True).stdout.split()
              urls = []
              for f in diff:
                  if f.endswith("index.html") and f != "404.html":
                      p = f[: -len("index.html")]
                      urls.append(f"https://{host}/{p}")
          urls = sorted(set(urls))
          print(len(urls), "URL(s)")
          for i in range(0, len(urls), 10000):
              body = json.dumps({"host": host, "key": key, "keyLocation": f"https://{host}/{key}.txt", "urlList": urls[i:i+10000]}).encode()
              req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body, headers={"Content-Type": "application/json; charset=utf-8"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      print("IndexNow:", r.status)
              except urllib.error.HTTPError as e:
                  print("IndexNow error:", e.code, e.read()[:300])
                  raise
          PY
