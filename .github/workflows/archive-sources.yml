name: Archive sources (Wayback Machine)
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: archive-sources
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Archive
        run: node tools/archive_sources.js 300
      - name: Save the list of archived copies
        run: |
          git config user.name "barotico-bot"; git config user.email "contact@barotico.com"
          git add archive/wayback.json
          if ! git diff --cached --quiet; then git commit -m "archive: Wayback Machine copies of sources"; git pull --rebase --autostash origin main; git push origin HEAD:main; fi
