# Barotico push service. Deployed by .github/workflows/push-deploy.yml (the KV id is filled in at deploy time). First deploy: 22/11/2026 (retry 2).
name = "barotico-push"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

# Privacy: no request logs, no traces (Workers Logs off). Nothing about visitors is recorded.
[observability]
enabled = false

[[kv_namespaces]]
binding = "PUSH"
id = "__KV_ID__"

[triggers]
crons = ["*/10 * * * *"]
